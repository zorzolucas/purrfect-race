# Exporta o jogo para Web (Godot 4.7.2, sem threads) e publica no GitHub Pages.
# Site: https://zorzolucas.github.io/purrfect-race/  (jogo em /jogo/, visualizador em /visualizador/)
# Em PRs só monta o site e guarda como artefato (baixar em Actions > execução > Artifacts).
# Plano e detalhes: docs/jogo-no-navegador.md
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSAO: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot e do template Web
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSAO }}-linux-web

      - name: Baixar o Godot e o template Web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSAO}-stable_linux.x86_64 ~/godot/godot
          # o pacote de templates tem 1,3 GB com todas as plataformas; só o Web fica no cache
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSAO}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSAO}.stable
          mkdir -p "$dest"
          unzip -qj /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/version.txt' -d "$dest"
          rm /tmp/templates.tpz

      - name: Importar o projeto
        run: ~/godot/godot --headless --path . --import || true

      - name: Exportar para Web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck
          ls -la build/web

      - name: Montar o site
        run: |
          mkdir -p build/site
          cp web/site/index.html build/site/
          cp web/splash.png build/site/capa.png
          cp web/icone.png build/site/icone.png
          cp -r visualizador build/site/visualizador
          cp -r build/web build/site/jogo
          du -sh build/site build/site/jogo

      - name: Guardar o site (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
          retention-days: 7

      - name: Preparar para o Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
