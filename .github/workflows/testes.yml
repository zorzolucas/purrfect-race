# Roda os testes automáticos do protótipo (testes/teste_*.gd) a cada push e PR.
# Para rodar no seu PC: Godot --headless --path . --script res://testes/rodar_testes.gd
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSAO: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSAO }}-linux

      - name: Baixar o Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSAO}-stable/Godot_v${GODOT_VERSAO}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSAO}-stable_linux.x86_64 ~/godot/godot

      - name: Importar o projeto
        run: ~/godot/godot --headless --path . --import || true

      - name: Rodar os testes
        run: ~/godot/godot --headless --path . --script res://testes/rodar_testes.gd
